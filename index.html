<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamentos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <img src="./images/icons8-contatos-100.png" alt="Icone de agenda">
            <h1>Lista de contatos</h1>
        </header>
        <form id="agendamento">
            <input id="nome-cliente" type="text" placeholder="Nome do cliente" required/>
            <input id="telefone-cliente" type="tel" placeholder="Telefone de contato" required maxlength="11" minlength="9"/>
            <button type="submit">Adicionar +</button>
        </form>
        <table cellspacing = "0">
            <thead>
                <tr>
                    <th>
                        Nome
                    </th>
                    <th>
                        Telefone
                    </th>
                </tr>
            </thead>
            <tbody>
                <td></td>
            </tbody>
        </table>
    </div>
    <script src="./main.js"></script>
</body>
</html>
